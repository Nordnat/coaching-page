name: Deploy CoachFlow

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ping serwera z GitHuba
        run: nc -vz ${{ secrets.HOSTING_IP }} 22

      - name: Wdrożenie CoachFlow przez natywne SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Używamy cudzysłowu " zamiast EOF, aby uniknąć błędów ze spacjami
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.SSH_USERNAME }}@${{ secrets.HOSTING_IP }} "
            set -x
            cd /docker/coachflow
            git config --global --add safe.directory /docker/coachflow
            git pull origin main
            
            # Prawidłowe ścieżki do Dockera (omijają błąd 127)
            /usr/bin/docker compose up -d --build || /usr/local/bin/docker-compose up -d --build
          "
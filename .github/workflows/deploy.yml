name: Deploy CoachFlow

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Wdrożenie CoachFlow przez natywne SSH
        run: |
          # 1. Stworzenie ukrytego folderu na klucz SSH
          mkdir -p ~/.ssh
          
          # 2. Zapisanie Twojego prywatnego klucza z sekretów do pliku
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          
          # 3. Nadanie odpowiednich uprawnień bezpieczeństwa kluczowi
          chmod 600 ~/.ssh/id_rsa
          
          # 4. Logowanie na serwer i wykonanie komend
          # Flaga StrictHostKeyChecking=no wyłącza ręczne potwierdzanie (wpisywanie "yes") przy pierwszym logowaniu
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.SSH_USERNAME }}@${{ secrets.HOSTING_IP }} << 'EOF'
            cd /docker/coachflow
            git pull origin main
            docker-compose up -d --build coachflow
          EOF
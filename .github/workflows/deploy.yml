name: Deploy CoachFlow

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Wdrożenie CoachFlow przez natywne SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.SSH_USERNAME }}@${{ secrets.HOSTING_IP }} << 'EOF'
            # set -x sprawi, że w logach GitHuba zobaczysz dokładnie, na której komendzie wystąpił problem
            set -x
            
            # 1. Wejście do folderu (używamy pełnej ścieżki, na wypadek gdyby cd zawiodło)
            cd /docker/coachflow
            
            # 2. Pobranie zmian
            git pull origin main
            
            # 3. Zbudowanie i restart kontenera (próbuje nowej wersji, a w razie błędu starszej)
            docker compose up -d --build coachflow || docker-compose up -d --build coachflow
          EOF
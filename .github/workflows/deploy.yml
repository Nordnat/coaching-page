name: Deploy CoachFlow

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Sprawdzenie połączenia SSH
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            nc -vz -w 10 "${{ secrets.HOSTING_IP }}" 22 && exit 0
            echo "Próba $i nieudana. Ponawiam za 15 sekund..."
            sleep 15
          done
          echo "Nie można połączyć się z VPS przez SSH."
          exit 1

      - name: Wdrożenie CoachFlow przez SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=3 \
            -i ~/.ssh/id_rsa \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.HOSTING_IP }}" "
              set -x
              cd /docker/coachflow
              git config --global --add safe.directory /docker/coachflow
              git fetch --all
              git reset --hard origin/main
              /usr/bin/docker compose down --remove-orphans
              /usr/bin/docker compose build --no-cache coachflow-web
              /usr/bin/docker compose up -d
            "
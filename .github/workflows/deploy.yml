name: Deploy CoachFlow

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ping serwera z GitHuba
        run: nc -vz ${{ secrets.HOSTING_IP }} 22

      - name: Wdrożenie CoachFlow przez natywne SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.SSH_USERNAME }}@${{ secrets.HOSTING_IP }} "
            set -x
            cd /docker/coachflow
            git config --global --add safe.directory /docker/coachflow
            git pull origin main
            
            # 1. Zgaszenie aktualnych kontenerów i usunięcie sierot blokujących porty
            /usr/bin/docker compose down --remove-orphans
            
            # 2. Zbudowanie i uruchomienie na czysto
            /usr/bin/docker compose up -d --build
          "